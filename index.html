<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use Case Diagram – AI-Driven Companion Web App × Ecount ERP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans", "Inter", system-ui, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
    color: #0f172a;
    padding: 32px;
  }
  header.page { text-align: center; margin-bottom: 20px; }
  .eyebrow {
    font-size: 14px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: #6366f1; margin-bottom: 10px;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .page .sub { margin-top: 6px; font-size: 16px; color: #64748b; }
  .wrap {
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
    padding: 20px; max-width: 1500px; margin: 0 auto; overflow-x: auto;
  }
  svg { display: block; width: 100%; height: auto; }
  .legend {
    max-width: 1500px; margin: 16px auto 0; display: flex; flex-wrap: wrap; gap: 22px;
    justify-content: center; font-size: 14px; color: #475569;
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .lg-actor { width: 16px; height: 16px; border: 2px solid #334155; border-radius: 50%; }
  .lg-uc { width: 28px; height: 15px; border: 2px solid #6366f1; border-radius: 999px; background: #fff; }
  .lg-sys { width: 18px; height: 15px; border: 2px dashed #64748b; border-radius: 4px; }
</style>
</head>
<body>
  <header class="page">
    <div class="eyebrow">AI-Driven Companion Web App × Ecount ERP</div>
    <h1>Use Case Diagram</h1>
    <p class="sub">Satu diagram menyeluruh — 12 use case &amp; seluruh aktor dalam satu sistem</p>
  </header>

  <div class="wrap"><div id="diagram"></div></div>

  <div class="legend">
    <span><span class="lg-actor"></span> Aktor</span>
    <span><span class="lg-uc"></span> Use Case</span>
    <span><span class="lg-sys"></span> Sistem Pendukung (Ecount ERP / AI Engine)</span>
    <span>&larr;&rarr; Asosiasi &nbsp;·&nbsp; &#8226;&#8226;&#8226; «include» ke sistem</span>
  </div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, a = {}, t) { const n = document.createElementNS(SVGNS, tag);
  for (const k in a) n.setAttribute(k, a[k]); if (t != null) n.textContent = t; return n; }
function wrap(text, max) {
  const w = text.split(" "); const lines = []; let l = "";
  for (const x of w) { if ((l + " " + x).trim().length > max) { if (l) lines.push(l); l = x; } else l = (l + " " + x).trim(); }
  if (l) lines.push(l); return lines;
}

/* ===== Data: 12 use case (urut atas->bawah) ===== */
const USECASES = [
  { id: "UC-01", t: "Memantau Dashboard Eksekutif",            c: "#6366f1" },
  { id: "UC-02", t: "Melihat Prediksi & Alert Stok",           c: "#6366f1" },
  { id: "UC-03", t: "Mengajukan & Memilih Penawaran Vendor",   c: "#0ea5e9" },
  { id: "UC-04", t: "Menyetujui Rekomendasi Perpindahan Stok", c: "#0ea5e9" },
  { id: "UC-05", t: "Stock Opname via Scan Barcode",           c: "#f59e0b" },
  { id: "UC-06", t: "Mencatat & Menganalisis Cacat Produk",    c: "#f59e0b" },
  { id: "UC-07", t: "Mengajukan Klaim Garansi",                c: "#ef4444" },
  { id: "UC-08", t: "Memesan Produk via Portal B2B",           c: "#10b981" },
  { id: "UC-09", t: "Menanyakan Stok/Status via Chatbot",      c: "#10b981" },
  { id: "UC-10", t: "Menindaklanjuti Klien Berisiko",          c: "#10b981" },
  { id: "UC-11", t: "Memantau Pencapaian KPI",                 c: "#8b5cf6" },
  { id: "UC-12", t: "Mengelola Tugas Lintas Divisi",           c: "#8b5cf6" },
];

/* Aktor. side: L (kiri) / R (kanan). uc: daftar id use case yang terhubung */
const ACTORS = [
  // --- kiri ---
  { name: "Direksi",          side: "L", uc: ["UC-01","UC-02"] },
  { name: "Purchasing",       side: "L", uc: ["UC-02","UC-03"] },
  { name: "Vendor",           side: "L", uc: ["UC-03"] },
  { name: "Kepala Gudang",    side: "L", uc: ["UC-04"] },
  { name: "Staf Gudang",      side: "L", uc: ["UC-05"] },
  { name: "Staf QC",          side: "L", uc: ["UC-06"] },
  // --- kanan ---
  { name: "Manajer Produksi", side: "R", uc: ["UC-06"] },
  { name: "Pelanggan",        side: "R", uc: ["UC-07","UC-09"] },
  { name: "Distributor",      side: "R", uc: ["UC-08"] },
  { name: "Sales",            side: "R", uc: ["UC-10","UC-11"] },
  { name: "Manajer Sales",    side: "R", uc: ["UC-11"] },
  { name: "Semua Divisi",     side: "R", uc: ["UC-12"] },
];

/* ===== Layout ===== */
const UC_RX = 160, UC_RY = 34;
const UC_GAP = 76;                 // jarak vertikal antar use case
const TOP = 70;
const ucX = 760;                   // kolom use case di tengah
const boundaryX = ucX - 300, boundaryW = 600;
const actorLX = 150, actorRX = ucX + 300 + 150 + 60;
const W = actorRX + 150;
const H = TOP + USECASES.length * UC_GAP + 90;

const ucY = i => TOP + i * UC_GAP + UC_RY;
const ucById = {};
USECASES.forEach((u, i) => ucById[u.id] = { ...u, x: ucX, y: ucY(i) });

const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });

/* arrow marker (include) */
const defs = el("defs");
const mk = el("marker", { id: "arw", viewBox: "0 0 10 10", refX: 9, refY: 5,
  markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
mk.append(el("path", { d: "M0,0 L10,5 L0,10 z", fill: "#94a3b8" }));
defs.append(mk);
svg.append(defs);

/* system boundary */
svg.append(el("rect", { x: boundaryX, y: 40, width: boundaryW, height: H - 150, rx: 20,
  fill: "rgba(248,250,252,0.65)", stroke: "#6366f1", "stroke-width": 2 }));
svg.append(el("text", { x: boundaryX + 20, y: 66, "font-size": 14, "font-weight": 700,
  fill: "#4f46e5", "letter-spacing": ".06em" }, "AI-DRIVEN COMPANION WEB APP"));

/* ---- aktor ---- */
function drawActor(cx, cy, label, side) {
  const g = el("g");
  g.append(el("circle", { cx, cy: cy - 24, r: 10, fill: "#fff", stroke: "#334155", "stroke-width": 2.3 }));
  g.append(el("line", { x1: cx, y1: cy - 14, x2: cx, y2: cy + 8, stroke: "#334155", "stroke-width": 2.3 }));
  g.append(el("line", { x1: cx - 13, y1: cy - 5, x2: cx + 13, y2: cy - 5, stroke: "#334155", "stroke-width": 2.3 }));
  g.append(el("line", { x1: cx, y1: cy + 8, x2: cx - 10, y2: cy + 24, stroke: "#334155", "stroke-width": 2.3 }));
  g.append(el("line", { x1: cx, y1: cy + 8, x2: cx + 10, y2: cy + 24, stroke: "#334155", "stroke-width": 2.3 }));
  wrap(label, 14).forEach((ln, i) =>
    g.append(el("text", { x: cx, y: cy + 40 + i * 14, "text-anchor": "middle",
      "font-size": 13, "font-weight": 600, fill: "#1e293b" }, ln)));
  svg.append(g);
  return { x: side === "L" ? cx + 13 : cx - 13, y: cy - 5 };
}

const leftActors = ACTORS.filter(a => a.side === "L");
const rightActors = ACTORS.filter(a => a.side === "R");
function placeSide(list, cx) {
  const span = H - 170;
  return list.map((a, i) => {
    const cy = TOP + 30 + (i + 0.5) * (span / list.length);
    const port = drawActor(cx, cy, a.name, a.side);
    return { ...a, port };
  });
}
const Ls = placeSide(leftActors, actorLX);
const Rs = placeSide(rightActors, actorRX);
const allActors = [...Ls, ...Rs];

/* ---- garis asosiasi aktor -> use case (digambar dulu, di belakang oval) ---- */
allActors.forEach(a => {
  a.uc.forEach(id => {
    const u = ucById[id];
    const from = a.port;
    const to = { x: a.side === "L" ? u.x - UC_RX : u.x + UC_RX, y: u.y };
    svg.append(el("line", { x1: from.x, y1: from.y, x2: to.x, y2: to.y,
      stroke: "#94a3b8", "stroke-width": 1.6 }));
  });
});

/* ---- blok sistem pendukung di bawah ---- */
const sysY = H - 54, sysW = 420, sysH = 56;
const sysG = el("g");
sysG.append(el("rect", { x: ucX - sysW / 2, y: sysY - sysH / 2, width: sysW, height: sysH, rx: 8,
  fill: "#fff", stroke: "#64748b", "stroke-width": 2, "stroke-dasharray": "7 5" }));
sysG.append(el("text", { x: ucX, y: sysY - 4, "text-anchor": "middle",
  "font-size": 14, "font-weight": 700, fill: "#334155" }, "Ecount ERP (API) + AI Engine"));
sysG.append(el("text", { x: ucX, y: sysY + 15, "text-anchor": "middle",
  "font-size": 12, fill: "#64748b" }, "«sistem pendukung»"));

/* ---- oval use case + garis «include» ke sistem ---- */
USECASES.forEach((u, i) => {
  const y = ucY(i);
  // include line
  svg.append(el("line", { x1: ucX, y1: y + UC_RY, x2: ucX, y2: sysY - sysH / 2,
    stroke: "#94a3b8", "stroke-width": 1.4, "stroke-dasharray": "5 5",
    "marker-end": "url(#arw)", opacity: .5 }));
  // oval
  svg.append(el("ellipse", { cx: ucX, cy: y, rx: UC_RX, ry: UC_RY,
    fill: "#fff", stroke: u.c, "stroke-width": 2.3 }));
  svg.append(el("text", { x: ucX, y: y - 9, "text-anchor": "middle",
    "font-size": 12, "font-weight": 700, fill: u.c }, u.id));
  const lines = wrap(u.t, 26);
  const sy = y + 6 - (lines.length - 1) * 7;
  lines.forEach((ln, k) => svg.append(el("text", { x: ucX, y: sy + k * 13,
    "text-anchor": "middle", "font-size": 11.5, "font-weight": 600, fill: "#0f172a" }, ln)));
});

svg.append(sysG);
document.getElementById("diagram").append(svg);
</script>
</body>
</html>
