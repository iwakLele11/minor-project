<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use Case Diagram – AI-Driven Companion Web App × Ecount ERP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans", "Inter", system-ui, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
    color: #0f172a;
    padding: 32px;
  }
  header.page { text-align: center; margin-bottom: 20px; }
  .eyebrow {
    font-size: 14px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: #6366f1; margin-bottom: 10px;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .page .sub { margin-top: 6px; font-size: 16px; color: #64748b; }
  .wrap {
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
    padding: 20px; max-width: 1400px; margin: 0 auto; overflow-x: auto;
  }
  svg { display: block; width: 100%; height: auto; }
  .legend {
    max-width: 1400px; margin: 16px auto 0; display: flex; flex-wrap: wrap; gap: 22px;
    justify-content: center; font-size: 14px; color: #475569;
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .lg-actor { width: 16px; height: 16px; border: 2px solid #334155; border-radius: 50%; }
  .lg-uc { width: 28px; height: 15px; border: 2px solid #6366f1; border-radius: 999px; background: #fff; }
  .lg-sys { width: 18px; height: 15px; border: 2px solid #6366f1; border-radius: 4px; }
</style>
</head>
<body>
  <header class="page">
    <div class="eyebrow">AI-Driven Companion Web App × Ecount ERP</div>
    <h1>Use Case Diagram</h1>
    <p class="sub">12 use case &amp; 6 aktor — setiap use case diakses tepat oleh satu aktor</p>
  </header>

  <div class="wrap"><div id="diagram"></div></div>

  <div class="legend">
    <span><span class="lg-actor"></span> Aktor</span>
    <span><span class="lg-uc"></span> Use Case</span>
    <span><span class="lg-sys"></span> Batas Sistem</span>
    <span>&larr;&rarr; Asosiasi</span>
  </div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, a = {}, t) { const n = document.createElementNS(SVGNS, tag);
  for (const k in a) n.setAttribute(k, a[k]); if (t != null) n.textContent = t; return n; }
function wrap(text, max) {
  const w = text.split(" "); const lines = []; let l = "";
  for (const x of w) { if ((l + " " + x).trim().length > max) { if (l) lines.push(l); l = x; } else l = (l + " " + x).trim(); }
  if (l) lines.push(l); return lines;
}

/* ===== 12 use case, urut atas->bawah, dikelompokkan per aktor =====
   actorSide: L (kiri) / R (kanan) menentukan dari sisi mana garis ditarik */
const USECASES = [
  { id: "UC-01", t: "Mengakses Dashboard Eksekutif", actor: "Direksi",    side: "L", c: "#6366f1" },
  { id: "UC-02", t: "Mengakses Prediksi Stok",       actor: "Direksi",    side: "L", c: "#6366f1" },
  { id: "UC-03", t: "Mengajukan Penawaran",          actor: "Vendor",     side: "L", c: "#0ea5e9" },
  { id: "UC-04", t: "Memilih Penawaran Vendor",      actor: "Purchasing", side: "R", c: "#0ea5e9" },
  { id: "UC-05", t: "Stock Opname via Barcode",      actor: "Tim Gudang", side: "R", c: "#f59e0b" },
  { id: "UC-06", t: "Menyetujui Perpindahan Stok",   actor: "Tim Gudang", side: "R", c: "#f59e0b" },
  { id: "UC-07", t: "Mengajukan Klaim Garansi",      actor: "Pelanggan",  side: "L", c: "#ef4444" },
  { id: "UC-08", t: "Memesan Produk via Portal B2B", actor: "Pelanggan",  side: "L", c: "#10b981" },
  { id: "UC-09", t: "Menanyakan Stok via Chatbot",   actor: "Pelanggan",  side: "L", c: "#10b981" },
  { id: "UC-10", t: "Menindaklanjuti Klien Berisiko",actor: "Tim Sales",  side: "R", c: "#10b981" },
  { id: "UC-11", t: "Mengakses Pencapaian KPI",      actor: "Tim Sales",  side: "R", c: "#8b5cf6" },
  { id: "UC-12", t: "Mengelola Tugas Lintas Divisi", actor: "Tim Sales",  side: "R", c: "#8b5cf6" },
];

/* ===== layout ===== */
const UC_RX = 150, UC_RY = 36;
const UC_GAP = 82;
const TOP = 70;
const ucX = 700;
const boundaryX = ucX - 230, boundaryW = 460;
const actorLX = 110, actorRX = ucX + 230 + 110 + 40;
const W = actorRX + 120;
const H = TOP + USECASES.length * UC_GAP + 40;

const ucY = i => TOP + i * UC_GAP + UC_RY;

const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });

/* system boundary */
svg.append(el("rect", { x: boundaryX, y: 40, width: boundaryW, height: H - 70, rx: 18,
  fill: "rgba(248,250,252,0.6)", stroke: "#6366f1", "stroke-width": 2.5 }));
svg.append(el("text", { x: ucX, y: 66, "text-anchor": "middle", "font-size": 14, "font-weight": 700,
  fill: "#4f46e5", "letter-spacing": ".06em" }, "AI-DRIVEN COMPANION WEB APP"));

/* ---- gambar aktor; kembalikan port sambung ---- */
function drawActor(cx, cy, label, side) {
  const g = el("g");
  g.append(el("circle", { cx, cy: cy - 24, r: 11, fill: "#fff", stroke: "#334155", "stroke-width": 2.4 }));
  g.append(el("line", { x1: cx, y1: cy - 13, x2: cx, y2: cy + 10, stroke: "#334155", "stroke-width": 2.4 }));
  g.append(el("line", { x1: cx - 14, y1: cy - 4, x2: cx + 14, y2: cy - 4, stroke: "#334155", "stroke-width": 2.4 }));
  g.append(el("line", { x1: cx, y1: cy + 10, x2: cx - 11, y2: cy + 27, stroke: "#334155", "stroke-width": 2.4 }));
  g.append(el("line", { x1: cx, y1: cy + 10, x2: cx + 11, y2: cy + 27, stroke: "#334155", "stroke-width": 2.4 }));
  wrap(label, 12).forEach((ln, i) =>
    g.append(el("text", { x: cx, y: cy + 44 + i * 15, "text-anchor": "middle",
      "font-size": 14, "font-weight": 700, fill: "#1e293b" }, ln)));
  svg.append(g);
  return { x: side === "L" ? cx + 14 : cx - 14, y: cy - 4 };
}

/* kumpulkan aktor unik + daftar index use case miliknya (untuk posisi vertikal = rata2) */
const actorMap = {};
USECASES.forEach((u, i) => {
  if (!actorMap[u.actor]) actorMap[u.actor] = { name: u.actor, side: u.side, rows: [] };
  actorMap[u.actor].rows.push(i);
});

/* posisi Y aktor = rata-rata Y use case yang dimilikinya */
const actorPorts = {};
Object.values(actorMap).forEach(a => {
  const avgY = a.rows.reduce((s, i) => s + ucY(i), 0) / a.rows.length;
  const cx = a.side === "L" ? actorLX : actorRX;
  actorPorts[a.name] = drawActor(cx, avgY, a.name, a.side);
});

/* ---- garis asosiasi (digambar sebelum oval supaya di belakang) ---- */
USECASES.forEach((u, i) => {
  const y = ucY(i);
  const port = actorPorts[u.actor];
  const to = { x: u.side === "L" ? ucX - UC_RX : ucX + UC_RX, y };
  svg.append(el("line", { x1: port.x, y1: port.y, x2: to.x, y2: to.y,
    stroke: "#64748b", "stroke-width": 1.8 }));
});

/* ---- oval use case ---- */
USECASES.forEach((u, i) => {
  const y = ucY(i);
  svg.append(el("ellipse", { cx: ucX, cy: y, rx: UC_RX, ry: UC_RY,
    fill: "#fff", stroke: u.c, "stroke-width": 2.4 }));
  svg.append(el("text", { x: ucX, y: y - 10, "text-anchor": "middle",
    "font-size": 12, "font-weight": 700, fill: u.c }, u.id));
  const lines = wrap(u.t, 24);
  const sy = y + 6 - (lines.length - 1) * 7;
  lines.forEach((ln, k) => svg.append(el("text", { x: ucX, y: sy + k * 14,
    "text-anchor": "middle", "font-size": 12.5, "font-weight": 600, fill: "#0f172a" }, ln)));
});

document.getElementById("diagram").append(svg);
</script>
</body>
</html>
